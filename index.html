      try {
        let id = localStorage.getItem(LS_KEYS.DEVICE_ID);
        if (!id) {

      } catch (e) {

      }

      try {
        localStorage.setItem(key, JSON.stringify(list));
      } catch (e) {
        console.warn('LocalStorage write warning:', e);
      }

    // Parser pintar untuk membaca teks firebaseConfig langsung dari console.firebase.google.com
    const parseFirebaseConfigInput = (rawText) => {
      if (!rawText || typeof rawText !== 'string') return null;
      const trimmed = rawText.trim();
      if (!trimmed) return null;

      // Coba parse JSON murni terlebih dahulu
      try {
        const parsed = JSON.parse(trimmed);
        if (parsed && parsed.apiKey && parsed.projectId) {
          return {
            apiKey: String(parsed.apiKey || '').trim(),
            authDomain: String(parsed.authDomain || `${parsed.projectId}.firebaseapp.com`).trim(),
            projectId: String(parsed.projectId || '').trim(),
            storageBucket: String(parsed.storageBucket || '').trim(),
            messagingSenderId: String(parsed.messagingSenderId || '').trim(),
            appId: String(parsed.appId || '').trim()
          };
        }
      } catch (e) {
        // Lanjut ke ekstraksi regex untuk format JS object dari Firebase Console
      }

      const extractField = (fieldName) => {
        const regex = new RegExp(`${fieldName}\\s*:\\s*["'\`]([^"'\`]+)["'\`]`, 'i');
        const match = trimmed.match(regex);
        return match ? match[1].trim() : '';
      };

      const apiKey = extractField('apiKey');
      const projectId = extractField('projectId');
      if (!apiKey || !projectId) return null;

      return {
        apiKey,
        authDomain: extractField('authDomain') || `${projectId}.firebaseapp.com`,
        projectId,
        storageBucket: extractField('storageBucket'),
        messagingSenderId: extractField('messagingSenderId'),
        appId: extractField('appId')
      };
    };

    // Mendeteksi konfigurasi Firebase dari berbagai sumber (URL Link Siswa, LocalStorage, Default Config, atau Sandbox Gemini)
    const resolveActiveFirebaseConfig = () => {
      // 1. Cek parameter URL ?fb=... (Link Otomatis yang dibagikan Guru ke Siswa)
      try {
        const params = new URLSearchParams(window.location.search);
        const fbParam = params.get('fb');
        if (fbParam) {
          const decoded = JSON.parse(atob(decodeURIComponent(fbParam)));
          if (decoded && decoded.apiKey && decoded.projectId) {
            localStorage.setItem(LS_KEYS.FB_CONFIG, JSON.stringify(decoded));
            return { config: decoded, source: 'link-guru' };
          }
        }
      } catch (e) {
        console.warn('Gagal membaca parameter fb dari URL:', e);
      }

      // 2. Cek LocalStorage (sudah pernah terhubung sebelumnya)
      try {
        const saved = localStorage.getItem(LS_KEYS.FB_CONFIG);
        if (saved) {
          const parsed = JSON.parse(saved);
          if (parsed && parsed.apiKey && parsed.projectId) {
            return { config: parsed, source: 'saved' };
          }
        }
      } catch (e) {}

      // 3. Cek DEFAULT_FIREBASE_CONFIG di dalam file index.html
      if (DEFAULT_FIREBASE_CONFIG.apiKey && DEFAULT_FIREBASE_CONFIG.projectId) {
        return { config: DEFAULT_FIREBASE_CONFIG, source: 'default' };
      }

      // 4. Cek environment bawaan Gemini Canvas (jika dijalankan di pratinjau Gemini)
      if (typeof window.__firebase_config !== 'undefined' && window.__firebase_config) {
        try {
          const envCfg = typeof window.__firebase_config === 'string'
            ? JSON.parse(window.__firebase_config)
            : window.__firebase_config;
          if (envCfg && envCfg.apiKey && envCfg.projectId) {
            return { config: envCfg, source: 'gemini-env' };
          }
        } catch (e) {}
      }

      return { config: null, source: 'none' };
    };

      scores: 'pai_ceria_scores',
      aas_submissions: 'pai_ceria_aas'
    };

    const LOCAL_KEY_MAP = {
      profiles: LS_KEYS.PROFILES,
      scores: LS_KEYS.SCORES,
      aas_submissions: LS_KEYS.AAS
    };

    const enqueuePendingSync = (item) => {
      const queue = readLocalList(LS_KEYS.PENDING_QUEUE);
      const filtered = queue.filter((q) => !(q.collectionName === item.collectionName && q.docId === item.docId));
      filtered.push(item);
      writeLocalList(LS_KEYS.PENDING_QUEUE, filtered);
    };

    const writeDocumentToFirestore = async (db, sdk, collectionName, docId, payload) => {
      const fbCollectionName = COLLECTION_MAP[collectionName] || collectionName;
      await sdk.setDoc(sdk.doc(db, fbCollectionName, docId), payload, { merge: true });
    };

    const saveRecord = async (db, appId, collectionName, payload, docId = null) => {
      const sdk = window.__FB_SDK__;
      const recordId = docId || 'rec_' + Date.now() + '_' + Math.random().toString(36).slice(2, 8);
      const dataWithId = {
        id: recordId,
        deviceId: getDeviceId(),
        ...payload
      };

      // 1. Selalu simpan terlebih dahulu ke LocalStorage agar tidak pernah hilang walau sinyal putus
      const lsKey = LOCAL_KEY_MAP[collectionName];
      if (lsKey) {
        const currentList = readLocalList(lsKey);
        const existingIdx = currentList.findIndex((x) => x.id === recordId);
        if (existingIdx >= 0) {
          currentList[existingIdx] = { ...currentList[existingIdx], ...dataWithId };
        } else {
          currentList.push(dataWithId);
        }
        writeLocalList(lsKey, currentList);
      }

      // 2. Kirim langsung ke Cloud Firestore (console.firebase.google.com)
      if (db && sdk) {
        try {
          await writeDocumentToFirestore(db, sdk, collectionName, recordId, dataWithId);
          return { synced: true, id: recordId };
        } catch (err) {
          console.warn('Firestore write queued for retry:', err);
          enqueuePendingSync({ collectionName, docId: recordId, payload: dataWithId });
          return { synced: false, id: recordId };
        }

    // --- KOMPONEN GENERIK GAME MENJODOHKAN DUA KOLOM ---
    const TwoColumnMatchGame = ({ title, instruction, pairs, leftKey, rightKey, chapterId, gameModeName, db, appId, user, profile, onBack, onFinish }) => {
      const [selectedLeft, setSelectedLeft] = useState(null);
      const [matchedIds, setMatchedIds] = useState({});
      const [wrongFlash, setWrongFlash] = useState('');
      const [isFinished, setIsFinished] = useState(false);
      const [isSaving, setIsSaving] = useState(false);

      const shuffledRight = useMemo(() => {
        const copy = [...pairs];
        for (let i = copy.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [copy[i], copy[j]] = [copy[j], copy[i]];
        }
        return copy;
      }, [pairs]);

      const handleRightClick = async (item) => {
        if (!selectedLeft || matchedIds[item.id]) return;

        if (selectedLeft.id === item.id) {
          const nextMatched = { ...matchedIds, [item.id]: true };
          setMatchedIds(nextMatched);
          setSelectedLeft(null);
          setWrongFlash('');

          if (Object.keys(nextMatched).length === pairs.length) {
            setIsFinished(true);
            setIsSaving(true);
            await saveRecord(db, appId, 'scores', {
              userId: user?.uid || getDeviceId(),
              studentName: profile.fullName,
              grade: profile.grade,
              chapterId,
              type: 'game',
              gameMode: gameModeName,
              score: 100,
              timestamp: Date.now()
            });
            setIsSaving(false);
          }
        } else {
          setWrongFlash('Pasangan belum tepat, coba pilih pasangan lainnya ya!');
          setSelectedLeft(null);
        }
      };

      if (isFinished) {
        return (
          <div className="max-w-md mx-auto pt-16 px-4 text-center">
            <Card className="border-4 border-emerald-200">
              <div className="text-7xl mb-3">🏆🌟</div>
              <h2 className="text-2xl sm:text-3xl font-black text-emerald-800 mb-2">Hebat Sekali!</h2>
              <p className="text-gray-600 mb-4">Kamu berhasil memasangkan semua kartu dengan tepat!</p>
              <div className="text-6xl font-black text-yellow-500 mb-6">100</div>
              {isSaving ? (
                <p className="text-gray-400 animate-pulse">Menyimpan skor ke Guru...</p>
              ) : (
                <div className="space-y-3">
                  <Button variant="secondary" onClick={onBack} className="w-full">Pilih Game Lainnya</Button>
                  <Button variant="outline" onClick={onFinish} className="w-full">Kembali ke Bab</Button>
                </div>
              )}
            </Card>
          </div>
        );
      }

      return (
        <div className="max-w-4xl mx-auto pt-6 px-4 pb-12">
          <Header
            title={title}
            subtitle={`Terjodohkan: ${Object.keys(matchedIds).length} / ${pairs.length}`}
            onBack={onBack}
          />
          <p className="text-center font-bold text-gray-700 bg-white p-3 rounded-2xl shadow-2xs border border-emerald-100 mb-5 text-xs sm:text-sm">
            {instruction}
          </p>

          {wrongFlash && (
            <div className="mb-4 bg-red-100 border border-red-300 text-red-800 font-bold text-xs sm:text-sm p-3 rounded-2xl text-center">
              ⚠️ {wrongFlash}
            </div>
          )}

          <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
            <div className="space-y-3">
              <h3 className="font-black text-emerald-900 text-center text-sm uppercase tracking-wider">1. Pilih Kartu Kiri</h3>
              {pairs.map((item) => {
                const isMatched = !!matchedIds[item.id];
                const isSelected = selectedLeft?.id === item.id;
                return (
                  <button
                    key={item.id}
                    disabled={isMatched}
                    onClick={() => {
                      setSelectedLeft(item);
                      setWrongFlash('');
                    }}
                    className={`w-full p-4 rounded-2xl border-2 text-left font-bold transition cursor-pointer ${
                      isMatched
                        ? 'bg-emerald-100 border-emerald-400 text-emerald-800 opacity-60 cursor-default'
                        : isSelected
                        ? 'bg-amber-300 border-amber-600 text-amber-950 scale-[1.02] shadow-md'
                        : 'bg-white border-emerald-200 hover:border-emerald-500 text-gray-900'
                    }`}
                  >
                    <div className="flex items-center justify-between gap-2">
                      <span className="text-base sm:text-lg">{item[leftKey]}</span>
                      {isMatched && <span>✅</span>}
                    </div>
                  </button>
                );
              })}
            </div>

            <div className="space-y-3">
              <h3 className="font-black text-sky-900 text-center text-sm uppercase tracking-wider">2. Pilih Pasangannya di Kanan</h3>
              {shuffledRight.map((item) => {
                const isMatched = !!matchedIds[item.id];
                return (
                  <button
                    key={item.id}
                    disabled={isMatched}
                    onClick={() => handleRightClick(item)}
                    className={`w-full p-4 rounded-2xl border-2 text-left font-bold transition cursor-pointer ${
                      isMatched
                        ? 'bg-emerald-100 border-emerald-400 text-emerald-800 opacity-60 cursor-default'
                        : 'bg-sky-50/70 border-sky-200 hover:border-sky-500 hover:bg-sky-100 text-gray-900'
                    }`}
                  >
                    <div className="flex items-center justify-between gap-2">
                      <span className="text-xs sm:text-sm">{item[rightKey]}</span>
                      {isMatched && <span>✅</span>}
                    </div>
                  </button>
                );
              })}
            </div>
          </div>
        </div>
      );
    };

    // --- GAME 1: KUIS CEPAT ---
    const QuizGame = ({ chapter, db, appId, user, profile, onBack, onFinish }) => {
      const questions = CHAPTER_DATA[chapter.id]?.quizGame || [];
      const [qIdx, setQIdx] = useState(0);
      const [score, setScore] = useState(0);
      const [selectedOpt, setSelectedOpt] = useState(null);
      const [isFinished, setIsFinished] = useState(false);
      const [isSaving, setIsSaving] = useState(false);

      const currentQ = questions[qIdx];

      const handleAnswer = async (optIdx) => {
        if (selectedOpt !== null) return;
        setSelectedOpt(optIdx);
        const isCorrect = optIdx === currentQ.ans;
        const nextScore = isCorrect ? score + Math.round(100 / questions.length) : score;
        if (isCorrect) setScore(nextScore);

        setTimeout(async () => {
          if (qIdx < questions.length - 1) {
            setQIdx(qIdx + 1);
            setSelectedOpt(null);
          } else {
            const finalScore = isCorrect && qIdx === questions.length - 1 && nextScore > 95 ? 100 : nextScore;
            setScore(finalScore);
            setIsFinished(true);
            setIsSaving(true);
            await saveRecord(db, appId, 'scores', {
              userId: user?.uid || getDeviceId(),
              studentName: profile.fullName,
              grade: profile.grade,
              chapterId: chapter.id,
              type: 'game',
              gameMode: 'Kuis Cepat',
              score: finalScore,
              timestamp: Date.now()
            });
            setIsSaving(false);
          }
        }, 850);
      };

      if (isFinished) {
        return (
          <div className="max-w-md mx-auto pt-16 px-4 text-center">
            <Card className="border-4 border-amber-200">
              <div className="text-7xl mb-3">🎉🏆</div>
              <h2 className="text-2xl sm:text-3xl font-black text-emerald-900 mb-2">Kuis Selesai!</h2>
              <p className="text-gray-600 mb-4">Skor Kuis Cepat kamu adalah:</p>
              <div className="text-6xl font-black text-amber-500 mb-6">{score}</div>
              {isSaving ? (
                <p className="text-gray-400 animate-pulse">Menyimpan skor ke Guru...</p>
              ) : (
                <div className="space-y-3">
                  <Button variant="secondary" onClick={onBack} className="w-full">Pilih Game Lainnya</Button>
                  <Button variant="outline" onClick={onFinish} className="w-full">Kembali ke Bab</Button>
                </div>
              )}
            </Card>
          </div>
        );
      }

      return (
        <div className="max-w-2xl mx-auto pt-6 px-4 pb-12">
          <Header title="Kuis Cepat" subtitle={`Soal ${qIdx + 1} dari ${questions.length}`} onBack={onBack} />
          <Card>
            <h3 className="text-lg sm:text-xl font-black text-gray-900 mb-6">{currentQ.q}</h3>
            <div className="space-y-3">
              {currentQ.options.map((opt, idx) => {
                let btnStyle = 'bg-emerald-50 border-emerald-200 hover:border-emerald-500 text-gray-900';
                if (selectedOpt !== null) {
                  if (idx === currentQ.ans) btnStyle = 'bg-emerald-500 border-emerald-700 text-white';
                  else if (idx === selectedOpt) btnStyle = 'bg-red-500 border-red-700 text-white';
                }
                return (
                  <button
                    key={idx}
                    onClick={() => handleAnswer(idx)}
                    className={`w-full p-4 rounded-2xl border-2 text-left font-bold transition cursor-pointer ${btnStyle}`}
                  >
                    {String.fromCharCode(65 + idx)}. {opt}

    // --- GAME 2: KELOMPOKKAN KARTU (DUA KATEGORI) ---
    const GroupSortGame = ({ title, instruction, items, leftGroup, rightGroup, leftLabel, rightLabel, chapterId, gameModeName, db, appId, user, profile, onBack, onFinish }) => {
      const shuffledItems = useMemo(() => {
        const copy = [...items];
        for (let i = copy.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [copy[i], copy[j]] = [copy[j], copy[i]];
        }
        return copy;
      }, [items]);

      const [idx, setIdx] = useState(0);
      const [correctCount, setCorrectCount] = useState(0);
      const [feedback, setFeedback] = useState(null);
      const [isFinished, setIsFinished] = useState(false);
      const [isSaving, setIsSaving] = useState(false);

      const currentItem = shuffledItems[idx];

      const handleChoose = async (chosenGroup) => {
        if (feedback !== null) return;
        const isCorrect = chosenGroup === currentItem.group;
        const nextCorrect = isCorrect ? correctCount + 1 : correctCount;
        if (isCorrect) setCorrectCount(nextCorrect);
        setFeedback(isCorrect ? 'correct' : 'wrong');

        setTimeout(async () => {
          setFeedback(null);
          if (idx < shuffledItems.length - 1) {
            setIdx(idx + 1);
          } else {
            const finalScore = Math.round((nextCorrect / shuffledItems.length) * 100);
            setIsFinished(true);
            setIsSaving(true);
            await saveRecord(db, appId, 'scores', {
              userId: user?.uid || getDeviceId(),
              studentName: profile.fullName,
              grade: profile.grade,
              chapterId,
              type: 'game',
              gameMode: gameModeName,
              score: finalScore,
              timestamp: Date.now()
            });
            setIsSaving(false);
          }
        }, 700);
      };

      if (isFinished) {
        const finalScore = Math.round((correctCount / shuffledItems.length) * 100);
        return (
          <div className="max-w-md mx-auto pt-16 px-4 text-center">
            <Card className="border-4 border-emerald-200">
              <div className="text-7xl mb-3">🌟🎯</div>
              <h2 className="text-2xl sm:text-3xl font-black text-emerald-900 mb-2">Permainan Selesai!</h2>
              <p className="text-gray-600 mb-4">Benar {correctCount} dari {shuffledItems.length} kartu</p>
              <div className="text-6xl font-black text-emerald-600 mb-6">{finalScore}</div>
              {isSaving ? (
                <p className="text-gray-400 animate-pulse">Menyimpan skor ke Guru...</p>
              ) : (
                <div className="space-y-3">
                  <Button variant="secondary" onClick={onBack} className="w-full">Pilih Game Lainnya</Button>
                  <Button variant="outline" onClick={onFinish} className="w-full">Kembali ke Bab</Button>
                </div>
              )}
            </Card>
          </div>
        );
      }

      return (
        <div className="max-w-2xl mx-auto pt-6 px-4 pb-12">
          <Header title={title} subtitle={`Kartu ${idx + 1} dari ${shuffledItems.length}`} onBack={onBack} />
          <p className="text-center text-xs sm:text-sm font-bold text-gray-600 mb-4">{instruction}</p>

          <Card className="text-center py-10 mb-6 border-4 border-amber-200">
            <div className="text-2xl sm:text-4xl font-black text-emerald-950">
              {currentItem.char || currentItem.text}
            </div>
            {feedback === 'correct' && <p className="mt-3 text-emerald-600 font-black">✅ Tepat Sekali!</p>}
            {feedback === 'wrong' && <p className="mt-3 text-red-600 font-black">❌ Kurang tepat, tetap semangat!</p>}
          </Card>

          <div className="grid grid-cols-2 gap-4">
            <button
              onClick={() => handleChoose(leftGroup)}
              className="bg-emerald-600 hover:bg-emerald-700 text-white font-black py-5 px-4 rounded-2xl shadow-md text-sm sm:text-base transition active:scale-95 cursor-pointer"
            >
              {leftLabel}
            </button>
            <button
              onClick={() => handleChoose(rightGroup)}
              className="bg-sky-600 hover:bg-sky-700 text-white font-black py-5 px-4 rounded-2xl shadow-md text-sm sm:text-base transition active:scale-95 cursor-pointer"

              {rightLabel}
            </button>
          </div>
        </div>
      );

    // --- GAME 3: MENGURUTKAN LANGKAH / POHON ---
    const OrderedSequenceGame = ({ title, instruction, steps, labelKey, chapterId, gameModeName, db, appId, user, profile, onBack, onFinish }) => {
      const shuffledSteps = useMemo(() => {
        const copy = [...steps];
        for (let i = copy.length - 1; i > 0; i--) {

        }
        return copy;
      }, [steps]);

      const [selectedSteps, setSelectedSteps] = useState([]);
      const [wrongMsg, setWrongMsg] = useState('');
      const [isFinished, setIsFinished] = useState(false);
      const [isSaving, setIsSaving] = useState(false);

      const handlePick = async (item) => {
        const expectedOrder = selectedSteps.length + 1;
        const itemOrder = item.order || item.step;

        if (itemOrder === expectedOrder) {
          const nextSelected = [...selectedSteps, item];
          setSelectedSteps(nextSelected);
          setWrongMsg('');

          if (nextSelected.length === steps.length) {
            setIsFinished(true);
            setIsSaving(true);
            await saveRecord(db, appId, 'scores', {
              userId: user?.uid || getDeviceId(),
              studentName: profile.fullName,
              grade: profile.grade,
              chapterId,
              type: 'game',
              gameMode: gameModeName,
              score: 100,
              timestamp: Date.now()
            });
            setIsSaving(false);
          }
        } else {
          setWrongMsg(`Belum tepat! Pilih urutan ke-${expectedOrder} terlebih dahulu ya.`);
        }
      };

      if (isFinished) {
        return (
          <div className="max-w-md mx-auto pt-16 px-4 text-center">

              <div className="text-6xl font-black text-amber-500 mb-6">100</div>

                <p className="text-gray-400 animate-pulse">Menyimpan skor ke Guru...</p>
              ) : (
                <div className="space-y-3">
                  <Button variant="secondary" onClick={onBack} className="w-full">Pilih Game Lainnya</Button>
                  <Button variant="outline" onClick={onFinish} className="w-full">Kembali ke Bab</Button>
                </div>
              )}
            </Card>
          </div>
        );
      }

      return (
        <div className="max-w-3xl mx-auto pt-6 px-4 pb-12">
          <Header title={title} subtitle={`Tersusun: ${selectedSteps.length} / ${steps.length}`} onBack={onBack} />
          <p className="text-center text-xs sm:text-sm font-bold text-gray-700 bg-white p-3 rounded-2xl border border-emerald-100 mb-4">
            {instruction}

          {wrongMsg && (

          {/* Slot yang sudah tersusun */}
          <div className="bg-emerald-50 border-2 border-emerald-200 rounded-3xl p-4 mb-6 space-y-2">
            <h4 className="font-black text-emerald-900 text-xs uppercase tracking-wider mb-2">Urutan Jawabanmu:</h4>
            {steps.map((_, idx) => {
              const filled = selectedSteps[idx];
              return (
                <div
                  key={idx}
                  className={`p-3 rounded-2xl border-2 flex items-center gap-3 font-bold text-xs sm:text-sm ${
                    filled ? 'bg-emerald-600 border-emerald-700 text-white' : 'bg-white/70 border-dashed border-emerald-300 text-gray-400'
                  }`}
                >
                  <span className="w-7 h-7 rounded-full bg-white/20 flex items-center justify-center font-black shrink-0">
                    {idx + 1}
                  </span>
                  <span>{filled ? filled[labelKey] : `Klik pilihan urutan ke-${idx + 1} di bawah...`}</span>
                </div>
              );
            })}
          </div>

          {/* Pilihan acak */}
          <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
            {shuffledSteps.map((item, idx) => {
              const itemOrder = item.order || item.step;
              const isUsed = selectedSteps.some((s) => (s.order || s.step) === itemOrder);
              if (isUsed) return null;
              return (
                <button
                  key={idx}
                  onClick={() => handlePick(item)}
                  className="bg-white hover:bg-amber-50 border-2 border-amber-300 text-gray-900 font-bold p-4 rounded-2xl text-left text-xs sm:text-sm shadow-2xs transition active:scale-95 cursor-pointer"

                  {item[labelKey]}
                </button>
              );
            })}
          </div>
        </div>
      );
    };

    // --- GAME KHUSUS BAB 1-1: KELOMPOKKAN 3 HARAKAT ---
    const HarakatThreeGroupGame = ({ items, chapterId, db, appId, user, profile, onBack, onFinish }) => {
      const shuffled = useMemo(() => [...items].sort(() => Math.random() - 0.5), [items]);
      const [idx, setIdx] = useState(0);
      const [correct, setCorrect] = useState(0);
      const [feedback, setFeedback] = useState(null);
      const [done, setDone] = useState(false);
      const [saving, setSaving] = useState(false);

      const cur = shuffled[idx];

      const pick = async (grp) => {
        if (feedback) return;
        const ok = grp === cur.group;
        const nextCorrect = ok ? correct + 1 : correct;
        if (ok) setCorrect(nextCorrect);
        setFeedback(ok ? 'ok' : 'no');

        setTimeout(async () => {
          setFeedback(null);
          if (idx < shuffled.length - 1) {
            setIdx(idx + 1);
          } else {
            const finalScore = Math.round((nextCorrect / shuffled.length) * 100);
            setDone(true);
            setSaving(true);
            await saveRecord(db, appId, 'scores', {
              userId: user?.uid || getDeviceId(),
              studentName: profile.fullName,
              grade: profile.grade,
              chapterId,
              type: 'game',
              gameMode: 'Kelompokkan Harakat',
              score: finalScore,
              timestamp: Date.now()
            });
            setSaving(false);
          }
        }, 650);
      };

      if (done) {
        const finalScore = Math.round((correct / shuffled.length) * 100);
        return (
          <Card className="max-w-md mx-auto text-center border-4 border-emerald-200">
            <div className="text-7xl mb-3">🏆✨</div>
            <h2 className="text-2xl font-black text-emerald-900 mb-2">Hebat!</h2>
            <p className="text-gray-600 mb-3">Benar {correct} dari {shuffled.length} huruf</p>
            <div className="text-6xl font-black text-amber-500 mb-6">{finalScore}</div>
            {saving ? (
              <p className="text-gray-400 animate-pulse">Menyimpan skor...</p>
            ) : (
              <div className="space-y-3">
                <Button variant="secondary" onClick={onBack} className="w-full">Pilih Game Lainnya</Button>
                <Button variant="outline" onClick={onFinish} className="w-full">Kembali ke Bab</Button>
              </div>
            )}
          </Card>
        );
      }

      return (
        <div>
          <Card className="text-center py-10 mb-6 border-4 border-sky-200">
            <p className="text-xs font-bold text-gray-500 mb-2">Huruf {idx + 1} dari {shuffled.length}</p>
            <div className="text-7xl font-black text-emerald-950 my-2">{cur.char}</div>
            {feedback === 'ok' && <p className="text-emerald-600 font-black mt-2">✅ Benar!</p>}
            {feedback === 'no' && <p className="text-red-600 font-black mt-2">❌ Kurang tepat!</p>}
          </Card>

          <div className="grid grid-cols-3 gap-3">
            <button onClick={() => pick('FATHAH')} className="bg-emerald-600 hover:bg-emerald-700 text-white font-black py-4 rounded-2xl shadow-md cursor-pointer">
              Fathah ( ـَ )
            </button>
            <button onClick={() => pick('KASRAH')} className="bg-sky-600 hover:bg-sky-700 text-white font-black py-4 rounded-2xl shadow-md cursor-pointer">
              Kasrah ( ـِ )
            </button>
            <button onClick={() => pick('DAMMAH')} className="bg-amber-500 hover:bg-amber-600 text-emerald-950 font-black py-4 rounded-2xl shadow-md cursor-pointer">

    // --- DASHBOARD GURU (TERINTEGRASI OTOMATIS DENGAN FIREBASE CLOUD) ---
    const TeacherDashboard = ({
      db,
      appId,
      scores,
      profiles,
      aasSubmissions,
      cloudStatus,
      onConnectFirebase,
      onDisconnectFirebase,
      onSyncNow,
      onBack
    }) => {
      const [activeTab, setActiveTab] = useState('rekap');
      const [gradeFilter, setGradeFilter] = useState('ALL');
      const [searchQuery, setSearchQuery] = useState('');
      const [showFirebaseModal, setShowFirebaseModal] = useState(false);
      const [rawConfigInput, setRawConfigInput] = useState('');
      const [configError, setConfigError] = useState('');
      const [copyNotice, setCopyNotice] = useState('');
      const [essayGrades, setEssayGrades] = useState({});
      const [savingEssayId, setSavingEssayId] = useState(null);

      // Deteksi apakah aplikasi sedang dibuka di Pratinjau (Preview) Gemini atau file lokal
      const isSandboxOrLocal = useMemo(() => {
        const proto = window.location.protocol;
        const host = window.location.hostname || '';
        return (
          proto === 'about:' ||
          proto === 'file:' ||
          window.location.origin === 'null' ||
          host.includes('usercontent') ||
          host.includes('webcontainer') ||
          host === 'localhost'
        );
      }, []);

      const publicBaseUrl = isSandboxOrLocal
        ? 'https://ekajulisa7-lang.github.io/Media-Pembelajaran-Digital/'
        : `${window.location.origin}${window.location.pathname}`;

      // Buat Link Otomatis untuk Siswa agar terhubung ke Firebase yang sama di server/jaringan apa pun
      const studentShareLink = useMemo(() => {
        if (!cloudStatus.config) return publicBaseUrl;
        try {
          const encoded = encodeURIComponent(btoa(JSON.stringify(cloudStatus.config)));
          return `${publicBaseUrl}?fb=${encoded}`;
        } catch (e) {
          return publicBaseUrl;
        }
      }, [cloudStatus.config, publicBaseUrl]);

      const [isSyncing, setIsSyncing] = useState(false);
      const [confirmDeleteKey, setConfirmDeleteKey] = useState('');

      // Fungsi salin teks menggunakan elemen textarea sementara & document.execCommand('copy')
      const handleCopyText = (text, successMessage) => {
        try {
          const textArea = document.createElement('textarea');
          textArea.value = text;
          textArea.style.position = 'fixed';
          textArea.style.left = '-9999px';
          textArea.style.top = '0';
          document.body.appendChild(textArea);
          textArea.focus();
          textArea.select();
          const copied = document.execCommand('copy');
          document.body.removeChild(textArea);

          if (copied) {
            setCopyNotice(successMessage);
            setTimeout(() => setCopyNotice(''), 4500);
          } else {
            setCopyNotice('Silakan blok dan salin teks pada kotak secara manual.');
            setTimeout(() => setCopyNotice(''), 4500);
          }
        } catch (err) {
          setCopyNotice('Silakan blok dan salin teks pada kotak secara manual.');
          setTimeout(() => setCopyNotice(''), 4500);
        }
      };

      // Rekap nilai per siswa untuk seluruh Bab (1-5) dan jumlah Game
      const studentRecap = useMemo(() => {
        const map = {};
        const normQuery = searchQuery.trim().toLowerCase();

        const ensureStudent = (name, grade) => {
          const cleanName = (name || 'Tanpa Nama').trim();
          const cleanGrade = String(grade || '1');
          const key = `${cleanGrade}_${cleanName.toLowerCase()}`;
          if (!map[key]) {
            map[key] = {
              name: cleanName,
              grade: cleanGrade,
              chapters: {},
              gamesCount: 0
            };
          }
          return map[key];
        };

        profiles.forEach((p) => {
          ensureStudent(p.fullName, p.grade);
        });

        scores.forEach((sc) => {
          const st = ensureStudent(sc.studentName, sc.grade);
          if (sc.type === 'assessment' && sc.chapterId) {
            const prev = st.chapters[sc.chapterId];
            if (!prev || (typeof sc.score === 'number' && sc.score >= prev.score)) {
              st.chapters[sc.chapterId] = {
                score: sc.score,
                timestamp: sc.timestamp || 0
              };
            }
          } else if (sc.type === 'game') {
            st.gamesCount += 1;
          }
        });

        aasSubmissions.forEach((sub) => {
          ensureStudent(sub.studentName, sub.grade);
        });

        return Object.values(map)
          .filter((st) => {
            if (gradeFilter !== 'ALL' && st.grade !== gradeFilter) return false;
            if (normQuery && !st.name.toLowerCase().includes(normQuery)) return false;
            return true;
          })
          .sort((a, b) => {
            if (a.grade !== b.grade) return a.grade.localeCompare(b.grade);
            return a.name.localeCompare(b.name);
          });
      }, [profiles, scores, aasSubmissions, gradeFilter, searchQuery]);

      // Filter hasil Asesmen Akhir Semester (AAS)
      const filteredAAS = useMemo(() => {
        const normQuery = searchQuery.trim().toLowerCase();
        return [...aasSubmissions]
          .filter((sub) => {
            if (gradeFilter !== 'ALL' && String(sub.grade) !== gradeFilter) return false;
            if (normQuery && !(sub.studentName || '').toLowerCase().includes(normQuery)) return false;
            return true;
          })
          .sort((a, b) => (b.timestamp || 0) - (a.timestamp || 0));

      // Simpan nilai Esai AAS oleh guru dan hitung nilai akhir
      const handleSaveEssayScore = async (sub) => {
        const rawVal = essayGrades[sub.id] !== undefined ? essayGrades[sub.id] : sub.essayScore;
        const numVal = Number(rawVal);
        if (rawVal === '' || rawVal === null || rawVal === undefined || Number.isNaN(numVal) || numVal < 0 || numVal > 100) {
          setCopyNotice('Masukkan nilai esai antara 0 sampai 100 terlebih dahulu.');
          setTimeout(() => setCopyNotice(''), 4000);
          return;
        }

        setSavingEssayId(sub.id);
        const mcVal = Number(sub.mcScore) || 0;
        const computedFinal = Math.round((mcVal + numVal) / 2);

        await saveRecord(
          db,
          appId,
          'aas_submissions',
          {
            ...sub,
            essayScore: numVal,
            finalScore: computedFinal,
            gradedAt: Date.now()
          },
          sub.id
        );

        await onSyncNow();
        setSavingEssayId(null);
        setCopyNotice(`Nilai esai ${sub.studentName} berhasil disimpan (Nilai Akhir: ${computedFinal}).`);
        setTimeout(() => setCopyNotice(''), 4500);

      // Hapus data (dengan konfirmasi 2x klik tanpa window.confirm)
      const handleDeleteRecord = async (collectionName, docId) => {
        if (!docId) return;
        const key = `${collectionName}:${docId}`;
        if (confirmDeleteKey !== key) {
          setConfirmDeleteKey(key);
          setCopyNotice('Klik tombol Hapus sekali lagi untuk mengonfirmasi penghapusan data.');
          setTimeout(() => {
            setConfirmDeleteKey((prev) => (prev === key ? '' : prev));
          }, 4000);
          return;
        }

        setConfirmDeleteKey('');
        const sdk = window.__FB_SDK__;
        if (db && sdk && COLLECTION_MAP[collectionName]) {
          try {
            await sdk.deleteDoc(sdk.doc(db, COLLECTION_MAP[collectionName], docId));
          } catch (err) {
            console.warn('Firestore delete warning:', err);
          }
        }

        const lsKey = LOCAL_KEY_MAP[collectionName];
        if (lsKey) {
          const updated = readLocalList(lsKey).filter((item) => item.id !== docId);
          writeLocalList(lsKey, updated);
        }

        await onSyncNow();
        setCopyNotice('Data berhasil dihapus.');
        setTimeout(() => setCopyNotice(''), 3500);
      };

      const handleDeleteStudentAllData = async (studentName, grade) => {

          return;

        setConfirmDeleteKey('');
        const sdk = window.__FB_SDK__;

        const matchingProfiles = profiles.filter(
          (p) => (p.fullName || '').trim().toLowerCase() === cleanTargetName && String(p.grade || '1') === cleanTargetGrade
        );
        const matchingScores = scores.filter(
          (s) => (s.studentName || '').trim().toLowerCase() === cleanTargetName && String(s.grade || '1') === cleanTargetGrade
        );
        const matchingAas = aasSubmissions.filter(
          (a) => (a.studentName || '').trim().toLowerCase() === cleanTargetName && String(a.grade || '1') === cleanTargetGrade
        );

        if (db && sdk) {
          const deletePromises = [
            ...matchingProfiles.map((item) =>
              item.id ? sdk.deleteDoc(sdk.doc(db, COLLECTION_MAP.profiles, item.id)).catch(() => {}) : Promise.resolve()
            ),
            ...matchingScores.map((item) =>
              item.id ? sdk.deleteDoc(sdk.doc(db, COLLECTION_MAP.scores, item.id)).catch(() => {}) : Promise.resolve()
            ),
            ...matchingAas.map((item) =>
              item.id ? sdk.deleteDoc(sdk.doc(db, COLLECTION_MAP.aas_submissions, item.id)).catch(() => {}) : Promise.resolve()
            )
          ];
          await Promise.all(deletePromises);
        }

        writeLocalList(
          LS_KEYS.PROFILES,
          readLocalList(LS_KEYS.PROFILES).filter(
            (p) => !((p.fullName || '').trim().toLowerCase() === cleanTargetName && String(p.grade || '1') === cleanTargetGrade)
          )
        );
        writeLocalList(
          LS_KEYS.SCORES,
          readLocalList(LS_KEYS.SCORES).filter(
            (s) => !((s.studentName || '').trim().toLowerCase() === cleanTargetName && String(s.grade || '1') === cleanTargetGrade)
          )
        );
        writeLocalList(
          LS_KEYS.AAS,
          readLocalList(LS_KEYS.AAS).filter(
            (a) => !((a.studentName || '').trim().toLowerCase() === cleanTargetName && String(a.grade || '1') === cleanTargetGrade)
          )
        );
        writeLocalList(
          LS_KEYS.PENDING_QUEUE,
          readLocalList(LS_KEYS.PENDING_QUEUE).filter((q) => {
            const p = q.payload || {};
            const pName = (p.studentName || p.fullName || '').trim().toLowerCase();
            const pGrade = String(p.grade || '1');

        setTimeout(() => setCopyNotice(''), 4000);

                  <tbody className="divide-y divide-gray-100 text-xs sm:text-sm">

                    ) : (

                        const validNums = scoresArr.filter((v) => typeof v === 'number');
                        const avg = validNums.length

                        const delKey = `student:${st.grade}_${st.name.trim().toLowerCase()}`;
                        const isConfirming = confirmDeleteKey === delKey;

                        return (
                          <tr key={idx} className="hover:bg-emerald-50/40">
                            <td className="p-3.5 font-bold text-gray-500">{idx + 1}</td>

                              </span>

                            {scoresArr.map((val, i) => (
                              <td key={i} className="p-3.5 text-center font-extrabold">
                                {typeof val === 'number' ? (
                                  <span className={`px-2.5 py-1 rounded-lg ${val >= 70 ? 'bg-emerald-100 text-emerald-800' : 'bg-red-100 text-red-800'}`}>
                                    {val}
                                  </span>
                                ) : (
                                  <span className="text-gray-300">—</span>

                            <td className="p-3.5 text-center font-black text-sky-700">{avg}</td>

                                    ? 'bg-red-600 text-white shadow-xs'
                                    : 'bg-red-50 text-red-600 hover:bg-red-100'
                                }`}
                              >
                                {isConfirming ? '⚠️ Yakin Hapus?' : '🗑️ Hapus'}

                        );
                      })

                  </tbody>
                </table>
              </div>
            )}

            {/* TAB 2: HASIL ASESMEN AKHIR SEMESTER (AAS PG & ESAI) */}
            {activeTab === 'aas' && (
              <div className="space-y-4">
                {filteredAAS.length === 0 ? (
                  <Card className="text-center text-gray-500 py-10">

                  </Card>
                ) : (
                  filteredAAS.map((sub) => (
                    <Card key={sub.id} className="border-2 border-indigo-100">
                      <div className="flex flex-wrap items-center justify-between gap-3 pb-4 mb-4 border-b border-gray-100">
                        <div>
                          <span className="bg-indigo-100 text-indigo-800 text-xs font-black px-2.5 py-0.5 rounded-full">
                            Kelas {sub.grade} SD
                          </span>
                          <h3 className="text-lg sm:text-xl font-black text-gray-900 mt-1">{sub.studentName}</h3>
                          <p className="text-xs text-gray-500">

                        <div className="flex flex-wrap items-center gap-3">
                          <div className="bg-sky-50 border border-sky-200 px-3.5 py-2 rounded-2xl text-center">
                            <p className="text-[10px] font-bold text-sky-700 uppercase">Nilai PG</p>
                            <p className="text-xl font-black text-sky-900">{sub.mcScore}</p>
                          </div>
                          <div className="bg-purple-50 border border-purple-200 px-3.5 py-2 rounded-2xl text-center">
                            <p className="text-[10px] font-bold text-purple-700 uppercase">Nilai Esai</p>
                            <p className="text-xl font-black text-purple-900">
                              {sub.essayScore !== null && sub.essayScore !== undefined ? sub.essayScore : 'Belum'}
                            </p>
                          </div>
                          <div className="bg-emerald-50 border border-emerald-200 px-3.5 py-2 rounded-2xl text-center">
                            <p className="text-[10px] font-bold text-emerald-700 uppercase">Nilai Akhir</p>
                            <p className="text-xl font-black text-emerald-800">
                              {sub.finalScore !== null && sub.finalScore !== undefined ? sub.finalScore : '-'}
                            </p>

                      </div>

                      {/* Daftar Jawaban Esai Siswa */}
                      <div className="space-y-2.5 mb-4">
                        <h4 className="text-xs font-black uppercase text-purple-900">Jawaban Esai Siswa:</h4>
                        {(sub.essayQuestions || []).map((qText, i) => (

                            <p className="font-bold text-gray-800">{qText}</p>

                      </div>

                      {/* Form Input Nilai Esai oleh Guru */}
                      <div className="flex flex-wrap items-center justify-between gap-3 pt-3 border-t border-gray-100">
                        <div className="flex items-center gap-2">
                          <label className="text-xs font-extrabold text-gray-700">Beri Nilai Esai (0–100):</label>
                          <input
                            type="number"

                          />
                          <button

                            onClick={() => handleSaveEssayScore(sub)}

                          >
                            {savingEssayId === sub.id ? 'Menyimpan...' : '💾 Simpan Nilai Esai'}
                          </button>
                        </div>

                        <button
                          onClick={() => handleDeleteRecord('aas_submissions', sub.id)}
                          className={`text-xs font-extrabold px-3 py-1.5 rounded-xl transition cursor-pointer ${
                            confirmDeleteKey === `aas_submissions:${sub.id}`
                              ? 'bg-red-600 text-white'
                              : 'text-red-600 hover:bg-red-50'
                          }`}
                        >
                          {confirmDeleteKey === `aas_submissions:${sub.id}` ? '⚠️ Yakin Hapus Data AAS?' : '🗑️ Hapus Data AAS'}
                        </button>
                      </div>
                    </Card>
                  ))
                )}
              </div>
            )}

            {/* TAB 3: RIWAYAT AKTIVITAS LENGKAP */}
            {activeTab === 'history' && (
              <div className="bg-white rounded-3xl shadow-sm border border-gray-200 overflow-x-auto">
                <table className="w-full text-left border-collapse">
                  <thead>
                    <tr className="bg-slate-800 text-white text-xs uppercase">
                      <th className="p-3.5">Waktu</th>
                      <th className="p-3.5">Nama Siswa</th>
                      <th className="p-3.5">Kelas</th>
                      <th className="p-3.5">Jenis Aktivitas</th>
                      <th className="p-3.5">Bab / Mode</th>
                      <th className="p-3.5 text-center">Skor</th>
                      <th className="p-3.5 text-center">Aksi</th>
                    </tr>
                  </thead>
                  <tbody className="divide-y divide-gray-100 text-xs sm:text-sm">
                    {filteredHistory.length === 0 ? (
                      <tr>
                        <td colSpan="7" className="p-8 text-center text-gray-500">
                          Belum ada riwayat aktivitas.
                        </td>
                      </tr>
                    ) : (
                      filteredHistory.map((item, idx) => (
                        <tr key={item.id || idx} className="hover:bg-gray-50">
                          <td className="p-3.5 text-xs text-gray-500">
                            {item.timestamp ? new Date(item.timestamp).toLocaleString('id-ID') : '-'}
                          </td>
                          <td className="p-3.5 font-bold text-gray-900">{item.studentName}</td>
                          <td className="p-3.5">Kelas {item.grade}</td>
                          <td className="p-3.5">
                            <span className={`text-xs font-extrabold px-2.5 py-0.5 rounded-full ${
                              item.type === 'assessment'
                                ? 'bg-sky-100 text-sky-800'
                                : 'bg-amber-100 text-amber-800'
                            }`}>
                              {item.type === 'assessment' ? 'Asesmen Bab' : 'Game Edukatif'}
                            </span>
                          </td>
                          <td className="p-3.5 font-semibold text-gray-700">
                            {item.chapterId ? `Bab ${item.chapterId}` : ''}{' '}
                            {item.gameMode ? `(${item.gameMode})` : item.chapterTitle ? `- ${item.chapterTitle}` : ''}
                          </td>
                          <td className="p-3.5 text-center font-black text-emerald-700">{item.score}</td>
                          <td className="p-3.5 text-center">
                            <button
                              onClick={() => handleDeleteRecord('scores', item.id)}
                              className={`text-xs font-extrabold px-2.5 py-1 rounded-xl transition cursor-pointer ${
                                confirmDeleteKey === `scores:${item.id}`
                                  ? 'bg-red-600 text-white'
                                  : 'text-red-600 hover:bg-red-50'
                              }`}
                            >
                              {confirmDeleteKey === `scores:${item.id}` ? '⚠️ Yakin Hapus?' : '🗑️ Hapus'}
                            </button>
                          </td>
                        </tr>
                      ))
                    )}
                  </tbody>
                </table>
              </div>
            )}
          </div>

          {/* MODAL PENGATURAN KONEKSI FIREBASE */}
          {showFirebaseModal && (
            <div className="fixed inset-0 bg-black/60 backdrop-blur-xs flex items-center justify-center p-4 z-50">
              <div className="bg-white rounded-3xl max-w-xl w-full p-6 sm:p-8 shadow-2xl border-4 border-emerald-200 max-h-[90vh] overflow-y-auto">
                <div className="flex items-center justify-between mb-4">
                  <h2 className="text-xl sm:text-2xl font-black text-emerald-950">
                    🔥 Hubungkan ke Firebase Cloud
                  </h2>
                  <button
                    onClick={() => setShowFirebaseModal(false)}
                    className="text-gray-400 hover:text-gray-700 font-black text-xl cursor-pointer"
                  >
                    ✕
                  </button>
                </div>

                <div className="bg-sky-50 border border-sky-200 rounded-2xl p-4 text-xs text-sky-950 space-y-1.5 mb-4">
                  <p className="font-black">Langkah Mudah Menghubungkan (Cukup 1 Kali):</p>
                  <ol className="list-decimal list-inside space-y-1">
                    <li>
                      Buka{' '}
                      <a
                        href="https://console.firebase.google.com"
                        target="_blank"
                        rel="noopener noreferrer"
                        className="underline font-extrabold text-blue-700"
                      >
                        console.firebase.google.com
                      </a>{' '}
                      dan pilih project Firebase Anda.
                    </li>
                    <li>
                      Pastikan menu <strong>Build → Firestore Database</strong> sudah aktif (mode <em>Test Mode</em>).
                    </li>
                    <li>
                      Buka <strong>Project Settings (ikon gerigi ⚙️) → Your apps → Web App (&lt;/&gt;)</strong>, lalu salin bagian <code>firebaseConfig</code>.
                    </li>
                    <li>Tempelkan (Paste) teks tersebut di kotak di bawah ini dan klik <strong>Simpan & Hubungkan</strong>.</li>
                  </ol>
                </div>

                {configError && (
                  <div className="mb-3 bg-red-50 border border-red-300 text-red-700 text-xs font-bold p-3 rounded-xl">
                    ⚠️ {configError}
                  </div>
                )}

                <form onSubmit={handleSaveConfigSubmit} className="space-y-4">
                  <div>
                    <label className="block text-xs font-extrabold text-gray-700 mb-1">
                      Tempelkan Kode firebaseConfig dari Firebase Console:
                    </label>
                    <textarea
                      rows="6"
                      value={rawConfigInput}
                      onChange={(e) => setRawConfigInput(e.target.value)}
                      placeholder={`Contoh:\nconst firebaseConfig = {\n  apiKey: "AIzaSy...",\n  authDomain: "project-anda.firebaseapp.com",\n  projectId: "project-anda",\n  storageBucket: "project-anda.appspot.com",\n  messagingSenderId: "123456789",\n  appId: "1:123456789:web:abcdef"\n};`}
                      className="w-full p-3 rounded-2xl border-2 border-emerald-200 focus:border-emerald-500 focus:outline-none font-mono text-xs"
                    />
                  </div>

                  <div className="flex flex-wrap items-center justify-between gap-2">
                    {cloudStatus.connected && (
                      <button
                        type="button"
                        onClick={() => {
                          onDisconnectFirebase();
                          setShowFirebaseModal(false);
                        }}
                        className="text-xs font-bold text-red-600 hover:underline cursor-pointer"
                      >
                        Putuskan Koneksi Cloud
                      </button>
                    )}
                    <div className="flex items-center gap-2 ml-auto">
                      <Button variant="outline" type="button" onClick={() => setShowFirebaseModal(false)}>
                        Batal
                      </Button>
                      <Button type="submit">Simpan & Hubungkan ☁️</Button>
                    </div>
                  </div>
                </form>
              </div>
            </div>
          )}
        </div>
      );
    };

    // =========================================================================
    // KOMPONEN UTAMA APLIKASI (APP) DENGAN REAL-TIME CLOUD SYNC
    // =========================================================================
    const App = () => {
      const [view, setView] = useState('landing');
      const [showAbout, setShowAbout] = useState(false);
      const [showTeacherLogin, setShowTeacherLogin] = useState(false);

      const [profile, setProfile] = useState(() => {
        try {
          const saved = localStorage.getItem(LS_KEYS.STUDENT_PROFILE);
          return saved ? JSON.parse(saved) : null;
        } catch (e) {
          return null;
        }
      });

      const [selectedChapter, setSelectedChapter] = useState(null);
      const [db, setDb] = useState(null);
      const [user, setUser] = useState(null);
      const [sdkReady, setSdkReady] = useState(!!window.__FB_SDK__);

      const [fbConfigState, setFbConfigState] = useState(() => resolveActiveFirebaseConfig());
      const [cloudConnected, setCloudConnected] = useState(false);

      const [scores, setScores] = useState(() => readLocalList(LS_KEYS.SCORES));
      const [profiles, setProfiles] = useState(() => readLocalList(LS_KEYS.PROFILES));
      const [aasSubmissions, setAasSubmissions] = useState(() => readLocalList(LS_KEYS.AAS));

      const appId = 'pai-ceria-fase-a';

      // Dengarkan kesiapan Firebase SDK
      useEffect(() => {
        if (window.__FB_SDK__) {
          setSdkReady(true);
          return;
        }
        const handler = () => setSdkReady(true);
        window.addEventListener('fb-sdk-ready', handler);
        return () => window.removeEventListener('fb-sdk-ready', handler);
      }, []);

      // Sinkronkan antrean data lokal yang tertunda ke Firestore
      const flushPendingQueue = useCallback(async (firestoreDb) => {
        const sdk = window.__FB_SDK__;
        if (!firestoreDb || !sdk) return;
        const queue = readLocalList(LS_KEYS.PENDING_QUEUE);
        if (!queue.length) return;

        const remaining = [];
        for (const item of queue) {
          try {
            await writeDocumentToFirestore(firestoreDb, sdk, item.collectionName, item.docId, item.payload);
          } catch (e) {
            remaining.push(item);
          }
        }
        writeLocalList(LS_KEYS.PENDING_QUEUE, remaining);
      }, []);

      // Inisialisasi & Langganan Real-time (onSnapshot) ke Cloud Firestore
      useEffect(() => {
        if (!sdkReady) return;
        const sdk = window.__FB_SDK__;
        const activeCfg = fbConfigState?.config;

        if (!activeCfg || !activeCfg.apiKey || !activeCfg.projectId) {
          setDb(null);
          setCloudConnected(false);
          return;
        }

        let unsubScores = null;
        let unsubProfiles = null;
        let unsubAas = null;
        let isCancelled = false;

        const initCloud = async () => {
          try {
            const appName = `pai-ceria-${activeCfg.projectId}`;
            const existingApps = sdk.getApps();
            const oldApp = existingApps.find((a) => a.name === appName);
            if (oldApp) {
              try {
                await sdk.deleteApp(oldApp);
              } catch (e) {}
            }
            const fbApp = sdk.initializeApp(activeCfg, appName);

            const auth = sdk.getAuth(fbApp);
            const firestore = sdk.getFirestore(fbApp);

            // Coba autentikasi anonim (tetap lanjut ke Firestore meski Anonymous Auth belum diaktifkan di Console)
            try {
              if (typeof window.__initial_auth_token !== 'undefined' && window.__initial_auth_token) {
                await sdk.signInWithCustomToken(auth, window.__initial_auth_token);
              } else if (!auth.currentUser) {
                await sdk.signInAnonymously(auth);
              }
              if (!isCancelled) setUser(auth.currentUser);
            } catch (authErr) {
              console.info('Firestore berjalan dalam mode akses langsung:', authErr?.code || authErr);
            }

            if (isCancelled) return;
            setDb(firestore);
            setCloudConnected(true);

            // Kirim ulang data lokal yang tertunda
            await flushPendingQueue(firestore);

            // Real-time listener untuk Nilai Asesmen & Game
            unsubScores = sdk.onSnapshot(
              sdk.collection(firestore, COLLECTION_MAP.scores),
              (snap) => {
                const cloudList = snap.docs.map((d) => ({ id: d.id, ...d.data() }));
                const pendingList = readLocalList(LS_KEYS.PENDING_QUEUE)
                  .filter((q) => q.collectionName === 'scores')
                  .map((q) => q.payload);
                const mergedMap = {};
                cloudList.forEach((item) => { if (item.id) mergedMap[item.id] = item; });
                pendingList.forEach((item) => { if (item.id) mergedMap[item.id] = item; });
                const merged = Object.values(mergedMap);
                writeLocalList(LS_KEYS.SCORES, merged);
                setScores(merged);
              },
              (err) => console.warn('Snapshot scores warning:', err)
            );

            // Real-time listener untuk Profil Siswa
            unsubProfiles = sdk.onSnapshot(
              sdk.collection(firestore, COLLECTION_MAP.profiles),
              (snap) => {
                const cloudList = snap.docs.map((d) => ({ id: d.id, ...d.data() }));
                const pendingList = readLocalList(LS_KEYS.PENDING_QUEUE)
                  .filter((q) => q.collectionName === 'profiles')
                  .map((q) => q.payload);
                const mergedMap = {};
                cloudList.forEach((item) => { if (item.id) mergedMap[item.id] = item; });
                pendingList.forEach((item) => { if (item.id) mergedMap[item.id] = item; });
                const merged = Object.values(mergedMap);
                writeLocalList(LS_KEYS.PROFILES, merged);
                setProfiles(merged);
              },
              (err) => console.warn('Snapshot profiles warning:', err)
            );

            // Real-time listener untuk Asesmen Akhir Semester (AAS)
            unsubAas = sdk.onSnapshot(
              sdk.collection(firestore, COLLECTION_MAP.aas_submissions),
              (snap) => {
                const cloudList = snap.docs.map((d) => ({ id: d.id, ...d.data() }));
                const pendingList = readLocalList(LS_KEYS.PENDING_QUEUE)
                  .filter((q) => q.collectionName === 'aas_submissions')
                  .map((q) => q.payload);
                const mergedMap = {};
                cloudList.forEach((item) => { if (item.id) mergedMap[item.id] = item; });
                pendingList.forEach((item) => { if (item.id) mergedMap[item.id] = item; });
                const merged = Object.values(mergedMap);
                writeLocalList(LS_KEYS.AAS, merged);
                setAasSubmissions(merged);
              },
              (err) => console.warn('Snapshot AAS warning:', err)
            );
          } catch (err) {
            console.error('Gagal menginisialisasi Firebase Cloud:', err);
            if (!isCancelled) {
              setCloudConnected(false);
            }
          }
        };

        initCloud();

        return () => {
          isCancelled = true;
          if (unsubScores) unsubScores();
          if (unsubProfiles) unsubProfiles();
          if (unsubAas) unsubAas();
        };
      }, [sdkReady, fbConfigState, flushPendingQueue]);

      const handleConnectFirebase = (newConfig) => {
        try {
          localStorage.setItem(LS_KEYS.FB_CONFIG, JSON.stringify(newConfig));
        } catch (e) {}
        setFbConfigState({ config: newConfig, source: 'manual-teacher' });
      };

      const handleDisconnectFirebase = () => {
        try {
          localStorage.removeItem(LS_KEYS.FB_CONFIG);
        } catch (e) {}
        setDb(null);
        setCloudConnected(false);
        setFbConfigState({ config: null, source: 'none' });
      };

      const handleManualSync = async () => {
        const sdk = window.__FB_SDK__;
        if (db && sdk) {
          await flushPendingQueue(db);
          try {
            const [scoreSnap, profSnap, aasSnap] = await Promise.all([
              sdk.getDocs(sdk.collection(db, COLLECTION_MAP.scores)),
              sdk.getDocs(sdk.collection(db, COLLECTION_MAP.profiles)),
              sdk.getDocs(sdk.collection(db, COLLECTION_MAP.aas_submissions))
            ]);
            const nextScores = scoreSnap.docs.map((d) => ({ id: d.id, ...d.data() }));
            const nextProfiles = profSnap.docs.map((d) => ({ id: d.id, ...d.data() }));
            const nextAas = aasSnap.docs.map((d) => ({ id: d.id, ...d.data() }));
            writeLocalList(LS_KEYS.SCORES, nextScores);
            writeLocalList(LS_KEYS.PROFILES, nextProfiles);
            writeLocalList(LS_KEYS.AAS, nextAas);
            setScores(nextScores);
            setProfiles(nextProfiles);
            setAasSubmissions(nextAas);
            return;
          } catch (err) {
            console.warn('Manual cloud refresh warning:', err);
          }
        }
        setScores(readLocalList(LS_KEYS.SCORES));
        setProfiles(readLocalList(LS_KEYS.PROFILES));
        setAasSubmissions(readLocalList(LS_KEYS.AAS));
      };

      const handleSaveProfile = async (newProfile) => {
        setProfile(newProfile);
        try {
          localStorage.setItem(LS_KEYS.STUDENT_PROFILE, JSON.stringify(newProfile));
        } catch (e) {}

        const profileId = `prof_${newProfile.grade}_${newProfile.fullName.toLowerCase().replace(/\s+/g, '_')}`;
        await saveRecord(db, appId, 'profiles', {
          userId: user?.uid || getDeviceId(),
          fullName: newProfile.fullName,
          grade: newProfile.grade,
          timestamp: Date.now()
        }, profileId);

        setView('dashboard');
      };

      const cloudStatus = {
        connected: cloudConnected,
        projectId: fbConfigState?.config?.projectId || '',
        config: fbConfigState?.config || null
      };

      return (
        <div className="min-h-screen">
          {view === 'landing' && (
            <LandingPage
              profile={profile}
              cloudStatus={cloudStatus}
              onStartStudent={() => setView(profile ? 'dashboard' : 'register')}
              onTeacherAccess={() => setShowTeacherLogin(true)}
              onOpenAbout={() => setShowAbout(true)}
            />
          )}

          {view === 'register' && (
            <StudentRegistration
              initialProfile={profile}
              cloudStatus={cloudStatus}
              onSave={handleSaveProfile}
              onBack={() => setView('landing')}
            />
          )}

          {view === 'dashboard' && profile && (
            <StudentDashboard
              profile={profile}
              cloudStatus={cloudStatus}
              onSelectChapter={(ch) => {
                setSelectedChapter(ch);
                setView('chapter');
              }}
              onSelectAAS={() => setView('aas')}
              onSwitchProfile={() => setView('register')}
              onHome={() => setView('landing')}
            />
          )}

          {view === 'chapter' && selectedChapter && (
            <ChapterDetail
              chapter={selectedChapter}
              onBack={() => setView('dashboard')}
              onSelectMode={(mode) => setView(mode)}
            />
          )}

          {view === 'material' && selectedChapter && (
            <MaterialViewer
              chapter={selectedChapter}
              onBack={() => setView('chapter')}
            />
          )}

          {view === 'game' && selectedChapter && profile && (
            <GameHub
              chapter={selectedChapter}
              db={db}
              appId={appId}
              user={user}
              profile={profile}
              onBack={() => setView('chapter')}
            />
          )}

          {view === 'assessment' && selectedChapter && profile && (
            <Assessment
              chapter={selectedChapter}
              db={db}
              appId={appId}
              user={user}
              profile={profile}
              cloudStatus={cloudStatus}
              onBack={() => setView('chapter')}
            />
          )}

          {view === 'aas' && profile && (
            <AASViewer
              profile={profile}
              db={db}
              appId={appId}
              user={user}
              onBack={() => setView('dashboard')}
            />
          )}

          {view === 'teacher-dashboard' && (
            <TeacherDashboard
              db={db}
              appId={appId}
              scores={scores}
              profiles={profiles}
              aasSubmissions={aasSubmissions}
              cloudStatus={cloudStatus}
              onConnectFirebase={handleConnectFirebase}
              onDisconnectFirebase={handleDisconnectFirebase}
              onSyncNow={handleManualSync}
              onBack={() => setView('landing')}
            />
          )}

          {showAbout && <AboutModal onClose={() => setShowAbout(false)} />}

          {showTeacherLogin && (
            <TeacherLoginModal
              onClose={() => setShowTeacherLogin(false)}
              onSuccess={() => {
                setShowTeacherLogin(false);
                setView('teacher-dashboard');
              }}
            />
          )}
        </div>
      );
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
